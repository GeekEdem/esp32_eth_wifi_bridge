<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="c3.title">C3 programmer</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1c1f24;--mute:#6b7280;--acc:#2563eb;--ok:#15803d;--bad:#b91c1c;--line:#d8dce2}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b1f25;--fg:#e8eaed;--mute:#9aa1ab;--acc:#5b8def;--ok:#4ade80;--bad:#f87171;--line:#2d333b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,button{width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{background:var(--acc);color:#fff;border:0;font-weight:600;margin-top:16px;cursor:pointer}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
code{font-size:13px;word-break:break-all;background:var(--bg);padding:2px 6px;border-radius:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mute{color:var(--mute);font-size:14px}
#msg{min-height:1.4em;margin-top:12px}
</style>
<script src="/auth.js"></script>
<script src="/ota.js"></script>
</head>
<body>
<main>
<h1 data-i18n="c3.heading">WT32 C3 programmer</h1>

<section>
<h2 data-i18n="c3.status">Status</h2>
<div id="state" class="mute" data-i18n="c3.loading">Loading…</div>
<div id="rfc" style="margin-top:8px"></div>
</section>

<section>
<h2>Wi-Fi</h2>
<label for="ssid" data-i18n="c3.network">Network</label>
<select id="ssid"><option value="" data-i18n="c3.scanning">Scanning…</option></select>
<input id="ssidManual" data-i18n-ph="c3.ssidManual" placeholder="Network name" style="display:none;margin-top:8px">
<button class="sec" id="rescan" type="button" data-i18n="c3.rescan">Refresh list</button>
<label for="pass" data-i18n="c3.password">Password</label>
<input id="pass" type="password" autocomplete="current-password" data-i18n-ph="c3.passOpen" placeholder="Empty: open network">
<label for="host" data-i18n="c3.host">Device name</label>
<input id="host" autocapitalize="off" spellcheck="false" placeholder="c3prog">
<div class="mute" style="margin-top:4px"><span data-i18n="c3.hostHint">The address will be</span> <code id="hostHint">c3prog.local</code></div>
<button id="save" type="button" data-i18n="c3.saveRestart">Save and restart</button>
</section>

<section>
<h2>WT32-ETH01</h2>
<div class="row">
<button class="sec" id="reset" type="button" data-i18n="c3.reset">Restart</button>
<button class="sec" id="boot" type="button" data-i18n="c3.boot">Download mode</button>
</div>
<div class="mute" style="margin-top:8px"><span data-i18n="c3.bootHint">“Download mode” is for flashing over USB with</span> <code>--before no_reset</code>.</div>
</section>

<section id="auth"></section>

<section id="ota"></section>

<section>
<button class="danger" id="forget" type="button" data-i18n="c3.forget">Forget Wi-Fi</button>
<div id="msg"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const t=(k,p)=>I18N.t(k,p);
const msg=(s,bad)=>{const m=$('msg');m.textContent=s;m.className=bad?'bad':'ok'};
let hostSet=false,cur=null,nets=null;

async function post(url,data){
  const r=await fetch(url,{method:'POST',body:new URLSearchParams(data)});
  const j=await r.json().catch(()=>({ok:false,key:'common.noAnswer'}));
  if(!j.ok)throw new Error(I18N.msg(j));
  return j;
}

function render(s){
  const st=$('state');
  if(!s){st.className='bad';st.textContent=t('c3.noConnection');return;}
  if(s.state==='connected'){st.className='ok';st.textContent=t('c3.connected',{ssid:s.ssid,ip:s.ip,rssi:s.rssi});}
  else if(s.state==='connecting'){st.className='mute';
    st.textContent=t('c3.connecting',{ssid:s.ssid})+(s.ap?' '+t('c3.setupOn',{ap:s.apSsid}):'');}
  else{st.className='mute';st.textContent=t('c3.notSaved');}
  const r=$('rfc');r.textContent='';
  if(s.state==='connected'){
    const a=document.createElement('code');a.textContent=`rfc2217://${s.host}.local:${s.port}`;
    const b=document.createElement('code');b.textContent=`rfc2217://${s.ip}:${s.port}`;
    r.append(t('c3.port')+' ',a,' '+t('c3.or')+' ',b);
  }
  if(s.client){const c=document.createElement('div');c.className='ok';c.textContent=t('c3.client');r.append(c);}
}

async function status(){
  try{
    cur=await (await fetch('/api/status')).json();
    if(!hostSet){$('host').value=cur.host;hint();hostSet=true;}
  }catch(e){cur=null;}
  render(cur);
}

function fillScan(){
  const sel=$('ssid');
  const keep=sel.value;
  sel.textContent='';
  const opt=(v,s)=>{const o=document.createElement('option');o.value=v;o.textContent=s;sel.append(o);};
  if(nets===null){opt('',t('c3.scanning'));return;}
  const seen=new Set();
  nets.slice().sort((a,b)=>b.rssi-a.rssi).forEach(n=>{
    if(seen.has(n.ssid))return;seen.add(n.ssid);
    opt(n.ssid,`${n.ssid}  (${t('c3.dbm',{n:n.rssi})}${n.open?t('c3.open'):''})`);
  });
  if(!nets.length)opt('',t('c3.noNets'));
  opt('__manual',t('c3.other'));
  if([...sel.options].some(o=>o.value===keep))sel.value=keep;
  pick();
}
async function scan(){
  const sel=$('ssid');sel.disabled=true;nets=null;fillScan();
  let list=[];
  try{list=await (await fetch('/api/scan')).json();}catch(e){}
  nets=Array.isArray(list)?list:[];
  sel.disabled=false;fillScan();
}
function pick(){$('ssidManual').style.display=$('ssid').value==='__manual'?'block':'none'}
function hint(){$('hostHint').textContent=($('host').value||'c3prog')+'.local'}

$('ssid').onchange=pick;
$('host').oninput=hint;
$('rescan').onclick=scan;
$('save').onclick=async()=>{
  const ssid=$('ssid').value==='__manual'?$('ssidManual').value.trim():$('ssid').value;
  if(!ssid)return msg(t('err.chooseANetwork'),true);
  $('save').disabled=true;
  const host=$('host').value.trim().toLowerCase();
  try{await post('/api/wifi',{ssid,pass:$('pass').value,host});
    msg(t('c3.saved',{ssid,host:host||'c3prog'}));}
  catch(e){msg(e.message,true);$('save').disabled=false;}
};
$('reset').onclick=async()=>{try{await post('/api/target',{action:'reset'});msg(t('c3.resetDone'));}catch(e){msg(e.message,true)}};
$('boot').onclick=async()=>{try{await post('/api/target',{action:'boot'});msg(t('c3.bootDone'));}catch(e){msg(e.message,true)}};
$('forget').onclick=async()=>{
  if(!confirm(t('c3.forgetConfirm')))return;
  try{await post('/api/forget',{});msg(t('c3.forgotten'));}catch(e){msg(e.message,true)}
};

I18N.onChange(()=>{render(cur);fillScan();});
I18N.ready.then(()=>{status();scan();setInterval(status,5000);});
</script>
</body>
</html>
